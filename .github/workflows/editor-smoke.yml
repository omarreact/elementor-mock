name: Editor React smoke test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  editor-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start development server
        run: |
          VITE_AUTH_ENABLED=false npm run dev > /tmp/elementor-smoke.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/elementor-smoke.log
          exit 1
      - name: Smoke test desktop/mobile editor
        run: node scripts/editor-render-smoke.mjs
      - name: Print server errors on failure
        if: failure()
        run: cat /tmp/elementor-smoke.log || true
